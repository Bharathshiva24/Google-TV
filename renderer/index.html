body{background:#0a0a0c}

.ov{position:fixed;inset:0;z-index:50;display:none}

#viewer{background:#000}

#vnote{font-size:12px;color:#9aa0a6}

#search,#settings{background:#0a0a0cf2;backdrop-filter:blur(14px)}
.panel{max-width:900px;margin:9vh auto 0;padding:0 24px;color:#e8eaed}
.panel h2{font-weight:400;font-size:28px;margin:0 0 18px}
#qi{width:100%;box-sizing:border-box;padding:18px 26px;font-size:26px;border-radius:40px;border:0;background:#2a2c31;color:#fff;outline:none}
.sec{margin:26px 0 10px;color:#9aa0a6;font-size:15px}
.res{display:flex;flex-wrap:wrap;gap:14px}
.r{display:flex;align-items:center;gap:12px;background:#1d1e22;border-radius:16px;padding:10px 16px;cursor:pointer;font-size:17px;outline:none;border:2px solid transparent}
.r:hover,.r:focus{border-color:#f1f3f4}

.row2{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #26272c;font-size:18px}

.x{position:fixed;top:22px;right:28px}

.tab{top:0;height:61px;line-height:61px;padding:0 28px;border-radius:31px;font-size:27px;color:#c4c7cc;cursor:pointer;white-space:nowrap;outline:none;transition:background .15s,color .15s,box-shadow .15s}

#hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,#0a0a0ccc 0%,#0a0a0c00 24%)}
@keyframes heroIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
#hero .glow.anim{animation:heroIn .6s ease-out}
#title,#sub,.brandrow{transition:opacity .3s}

/* Horizontally scrollable rows. Padding leaves room for the hover/focus ring,
   which would otherwise be clipped by the scroll container. */
.srow{position:absolute;display:flex;gap:34px;align-items:center;padding:16px;
      overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain}
.srow::-webkit-scrollbar{display:none}

#hero{transition:opacity .35s}
body.grid #hero{opacity:.28}

.ggrid.apps{grid-template-columns:repeat(5,1fr);gap:46px 34px;justify-items:center}
.gitem{outline:none;cursor:pointer;display:block}
.gart{width:100%;aspect-ratio:16/9;border-radius:18px;background:#191a1e center/cover no-repeat;
      transition:transform .15s,box-shadow .15s}

.glabel{margin-top:12px;font-size:17px;color:#e8eaed;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ggrid.apps .glabel{text-align:center;max-width:160px}
.gyear{color:#9aa0a6;font-size:15px;margin-top:2px}
</style></head>

// A scrolling row: trackpad swipes work natively, a plain mouse wheel is mapped to
// horizontal, and keyboard focus pulls the next item into view.
function makeRow(id,top,height){
 const r=$(`<div class="srow" id="${id}"></div>`);
 r.style.left=(123-OX-16)+'px';
 r.style.top=(top-OY-16)+'px';
 r.style.width=(1654-(123-OX-16))+'px';
 r.style.height=(height+32)+'px';
 S.appendChild(r);
 r.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&e.deltaY!==0){r.scrollLeft+=e.deltaY;e.preventDefault();}
 },{passive:false});
 r.addEventListener('focusin',e=>{
  if(e.target.scrollIntoView)e.target.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
 });
 return r;
}

// Logos are always contain-fitted: never cropped, zoomed or stretched.
// When the icon brings its own opaque background we paint the tile that colour and let
// the icon fill it, so a square icon blends into the circle instead of being clipped.
function applyLogo(a,p,meta){
 const srcs=[{src:'logos/'+p.id+'.png'},{src:'logos/'+p.id+'.svg'}];
 if(meta)srcs.push(typeof meta==='string'?{src:meta}:meta);
 (function next(i){
  if(i>=srcs.length)return;
  const m=srcs[i],im=new Image();
  im.onload=()=>{
   a.innerHTML='';
   a.style.background=m.bg||p.bg;
   const fill=!!m.bg;                       // icon supplies its own backdrop
   im.style.cssText='display:block;margin:auto;object-fit:contain;'+
     (fill?'width:100%;height:100%':'width:64%;height:64%');
   a.appendChild(im);
  };
  im.onerror=()=>next(i+1);
  im.src=m.src;
 })(0);
}
APPS.forEach((p,i)=>{
 const a=$(`<div class="app" tabindex="0">${p.n}</div>`);
 if(p.id){appEls.push({a,p});applyLogo(a,p)}

 a.onclick=()=>openUrl(p.u,p.name||p.n.replace(/<br>/g,' '));

function fit(){const s=Math.min(innerWidth/1654,innerHeight/931);
 const tx=(innerWidth-1654*s)/2-23*s, ty=(innerHeight-931*s)/2-51*s;
 document.getElementById('stage').style.transform=`translate(${tx}px,${ty}px) scale(${s})`;}

function fs(){if(window.hub)return window.hub.fullscreen();try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
document.addEventListener('dblclick',e=>{if(!e.target.closest('a'))fs()});

// arrow-key (D-pad) navigation between cards and apps
// grid navigation: left/right within a row, up/down by one row
document.addEventListener('keydown',e=>{
 if(!document.body.classList.contains('grid'))return;
 if(!e.key.startsWith('Arrow')||document.querySelector('.ov.on')||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
 const items=[...document.querySelectorAll('.gitem')];
 if(!items.length)return;
 const head=[...document.querySelectorAll('.avatar,.tab,.ico')].sort((a,b)=>a.getBoundingClientRect().left-b.getBoundingClientRect().left);
 const f=document.activeElement,i=items.indexOf(f),cols=gridCols();
 e.preventDefault();
 if(i<0){ // coming from the header
  if(e.key==='ArrowDown')items[0].focus();
  else{const hi=head.indexOf(f);if(hi>=0){if(e.key==='ArrowRight')(head[hi+1]||head[hi]).focus();if(e.key==='ArrowLeft')(head[hi-1]||head[hi]).focus();}}
  return;
 }
 let n=i;
 if(e.key==='ArrowRight')n=Math.min(i+1,items.length-1);
 if(e.key==='ArrowLeft')n=Math.max(i-1,0);
 if(e.key==='ArrowDown')n=Math.min(i+cols,items.length-1);
 if(e.key==='ArrowUp'){
  if(i<cols){(tabEls.find(t=>t.classList.contains('on'))||head[0]).focus();return}
  n=i-cols;
 }
 items[n].focus();
 items[n].scrollIntoView({block:'nearest',behavior:'smooth'});
});

document.addEventListener('keydown',e=>{
 if(!e.key.startsWith('Arrow')||document.querySelector('.ov.on')||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
 if(document.body.classList.contains('grid'))return;   // grid tabs have their own handler
 const head=[...document.querySelectorAll('.avatar,.tab,.ico')].sort((a,b)=>a.getBoundingClientRect().left-b.getBoundingClientRect().left);
 const vis=e=>e.offsetParent!==null;
 const cards=[...document.querySelectorAll('.card')].filter(vis),apps=[...document.querySelectorAll('.app')].filter(vis);
 const rows=[head,cards,apps].filter(r=>r.length),f=document.activeElement;
 let ri=rows.findIndex(r=>r.includes(f));
 if(ri<0){(cards[0]||apps[0]||head[0]).focus();e.preventDefault();return}
 const r=rows[ri],i=r.indexOf(f);e.preventDefault();
 if(e.key==='ArrowRight')(r[i+1]||r[i]).focus();
 if(e.key==='ArrowLeft')(r[i-1]||r[i]).focus();
 if(e.key==='ArrowDown'&&rows[ri+1])rows[ri+1][Math.min(i,rows[ri+1].length-1)].focus();
 if(e.key==='ArrowUp'&&rows[ri-1]){const up=rows[ri-1];(up===head?(tabEls.find(t=>t.classList.contains('on'))||up[0]):up[Math.min(i,up.length-1)]).focus()}
});

/* ---- viewer / search / settings ---- */
const ST=(()=>{try{return JSON.parse(localStorage.getItem('gtv.settings'))||{}}catch{return {}}})();

function closeOv(){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'));if(window.hub&&el('viewer').classList.contains('on'))window.hub.home();el('vframe').src='about:blank'}

function catalog(){
 const items=[];
 APPS.forEach(a=>items.push({k:'app',t:a.name||a.n.replace(/<br>/g,' '),u:a.u,c:a.bg,a}));
 PICKS.filter(p=>p.t).forEach(p=>items.push({k:'title',t:(/^(\S ){2,}\S$/.test(p.t.trim())?p.t.replace(/ /g,''):p.t.trim()),u:p.url,c:p.c1}));

function openSearch(q){closeOv();el('search').classList.add('on');el('qi').value=q||'';runSearch(q||'');setTimeout(()=>el('qi').focus(),30)}
function runSearch(q){
 q=q.trim().toLowerCase();const box=el('qres');box.innerHTML='';
 const cat=catalog();
 const add=(title,list)=>{if(!list.length)return;const h=document.createElement('div');h.className='sec';h.textContent=title;box.appendChild(h);
  const r=document.createElement('div');r.className='res';list.forEach(x=>{const d=document.createElement('div');d.className='r';d.tabIndex=0;
   d.innerHTML=`<i style="background:${x.c||'#444'}"></i><span>${x.label||x.t}</span>`;
   const go=()=>{closeOv();openUrl(x.u,x.t)};d.onclick=go;d.onkeydown=e=>{if(e.key==='Enter')go()};r.appendChild(d)});box.appendChild(r)};
 const match=x=>!q||(x.t+' '+(x.sub||'')).toLowerCase().includes(q);
 add('Apps',cat.filter(x=>x.k==='app'&&match(x)));
 add('Titles',cat.filter(x=>x.k==='title'&&match(x)));
 if(q){ // search the query inside each service, shown in the viewer
  add(`Search "${el('qi').value.trim()}" in…`,APPS.filter(a=>a.search).map(a=>({t:a.name+' · '+el('qi').value.trim(),label:a.name,u:a.search+encodeURIComponent(el('qi').value.trim()),c:a.bg})));
 }
 if(q&&!box.children.length)box.innerHTML='<div class="sec">No matches</div>';
}

/* ---- real artwork from TMDB ---- */
const TMDB_LS='gtv.tmdbKey';
// No key in the source. Settings wins; otherwise the app reads tmdb-key.txt.
const tmdbKey=()=>{try{return localStorage.getItem(TMDB_LS)||''}catch{return ''}};
async function effectiveKey(){
 const k=tmdbKey(); if(k)return k;
 if(window.hub&&window.hub.tmdbKey){try{return (await window.hub.tmdbKey())||''}catch{}}
 return '';
}
function setStatus(t){const e=el('tmdbStatus');if(e)e.textContent=t}
let arting=false;
async function artwork(force){
 const key=await effectiveKey();
 if(!key){setStatus('not configured');return}
 if(!window.hub||!window.hub.tmdb){setStatus('only available in the desktop app');return}
 if(arting)return; arting=true;
 setStatus('loading…');
 let got=0,miss=0;
 try{
  for(const sl of SLIDES){
   if(sl.img&&!force)continue;
   const r=await window.hub.tmdb(sl.title,key);
   if(r&&r.error){setStatus(r.error);arting=false;return}
   if(r&&r.hero){sl.img=r.hero;got++;if(SLIDES[cur]===sl)paintHero(sl)}else miss++;
  }
  for(const p of [...PICKS,...MOVIES,...SHOWS]){
   if(!p.t||(p.img&&!force))continue;
   const r=await window.hub.tmdb(p.t,key);
   if(r&&r.error){setStatus(r.error);arting=false;return}
   if(r&&r.card){p.img=r.card;p.poster=!!r.poster;if(r.name)p.name=r.name;if(r.year)p.year=r.year;got++}else miss++;
  }
  if(curTab==='For you')renderPicks(curList,curHeading);
  else setTab(curTab);
  setStatus(got?`loaded ${got} images`+(miss?`, ${miss} not found`:''):'no artwork found');
 }catch(e){setStatus('failed: '+e.message)}
 arting=false;
}
el('stRot').onchange=e=>{ST.rotate=e.target.checked;saveST();reset()};
el('aAdd').onclick=()=>{let n=el('aN').value.trim(),u=el('aU').value.trim();if(!n||!u)return;if(!/^https?:\/\//.test(u))u='https://'+u;
 try{const x=JSON.parse(localStorage.getItem('gtv.extra')||'[]');x.push({n,name:n,u,bg:'#3a3a3c',fg:'#fff',fs:20});localStorage.setItem('gtv.extra',JSON.stringify(x))}catch{}location.reload()};
el('tmdbSave').onclick=()=>{try{localStorage.setItem(TMDB_LS,el('tmdbKey').value.trim())}catch{}artwork(true)};
artwork(false);
el('stReset').onclick=()=>{try{localStorage.removeItem('gtv.settings');localStorage.removeItem('gtv.extra');localStorage.removeItem(TMDB_LS)}catch{}location.reload()};
